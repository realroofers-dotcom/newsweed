<script>
(function () {
  var API = "https://newsweed-obits.realroofers.workers.dev", E = NW.esc;
  var id = new URLSearchParams(location.search).get("id"), el = document.getElementById("ob");
  function date(s) { if (!s) return ""; var d = new Date(s + "T12:00:00Z"); return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric", timeZone: "UTC" }); }
  if (!id) { el.innerHTML = "<p>No obituary was chosen.</p>"; return; }
  fetch(API + "/obit?id=" + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { el.innerHTML = "<p>This obituary could not be found.</p>"; return; }
    var o = d.item;
    document.title = o.name + " — Obituary — Newsweed";
    el.innerHTML = (o.photo_url ? '<img src="' + E(o.photo_url) + '" alt="' + E(o.name) + '"><p class="credit">' + E(o.photo_credit || "") + '</p>' : "")
      + '<h1>' + E(o.name) + '</h1>'
      + '<div class="dates">' + (o.birth_date ? date(o.birth_date) + " – " : "") + date(o.death_date) + (o.age != null ? " · age " + o.age : "") + (o.hometown ? " · " + E(o.hometown) : "") + '</div>'
      + '<div class="cat">' + E(o.category || "") + '</div>'
      + '<div class="story">' + E(o.story || "") + '</div>'
      + (o.services ? '<div class="serv"><b>Services</b>\n' + E(o.services) + '</div>' : "")
      + '<p class="src">' + (o.kind === "family" ? "Shared by " + (o.relationship ? "a " + E(o.relationship.toLowerCase()) : "the family") + " on " + date((o.posted_at || "").slice(0, 10)) + "."
          : "Written by Newsweed from public records. Sources: " + (o.sources || []).map(function (s) { return '<a href="' + E(s.url) + '" target="_blank" rel="noopener">' + E(s.label) + '</a>'; }).join(", ") + ".") + '</p>';
  }).catch(function () { el.innerHTML = "<p>The obituary could not be loaded just now.</p>"; });
})();
</script>
