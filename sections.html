(function () {
  var E = NW.esc, tries = 0;
  function draw() {
    var apps = window.NW_APPS && window.NW_APPS.list, svg = window.NW_APP_SVG, sects = window.NW_SECTIONS || [];
    if (!apps || !svg) { if (tries++ < 50) return setTimeout(draw, 100); }
    var desc = {}; sects.forEach(function (s) { desc[s[0]] = s[2]; });
    document.getElementById("dir").innerHTML = (apps || []).filter(function (a) { return a[0] !== "/sections.html"; }).map(function (a) {
      return '<a href="' + E(a[0]) + '"><span class="ic" style="background:' + E(a[3]) + '">' + (svg ? svg(a[2]) : "") + '</span><span><b>' + E(a[1]) + '</b>'
        + (desc[a[0]] ? '<span class="d">' + E(desc[a[0]]) + '</span>' : "") + '</span></a>';
    }).join("");
  }
  draw();
})();
